<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VALGARD — Le Dernier Rempart</title>
<style>
:root{--bg:#0c0e11;--panel:#171c20;--panel2:#20272d;--line:#39434b;--text:#edf2f4;--muted:#aab4ba;--accent:#c89b54;--titan:#8b3a3a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at top,#232a30 0,#101316 55%,#0a0c0e 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input,select{font:inherit}
button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left}
button:active{transform:scale(.98)}
button.primary{background:linear-gradient(135deg,#b98b4b,#8b6736);border-color:#d8ae6c;color:#1a1206;font-weight:700;text-align:center}
button.wide{width:100%;text-align:center;margin-top:10px}
.hidden{display:none!important}

#titleScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,#2a333a 0,#0c0e11 65%)}
#titleScreen h1{font-size:clamp(26px,7.5vw,44px);letter-spacing:3px;margin:0;color:var(--accent);text-shadow:0 0 30px #c89b5455}
#titleScreen h1 span{display:block;font-size:.48em;letter-spacing:6px;color:var(--text);margin-top:6px}
#titleScreen .tagline{color:var(--muted);margin:14px 0 30px;font-size:14px;max-width:360px}
#titleScreen .titlebtns{display:flex;flex-direction:column;gap:10px;width:min(320px,80vw)}
#titleScreen button{padding:16px}
.foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#6b747a;font-size:10.5px;padding:0 16px}

#createScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.createCard{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 20px 50px #000a}
.createCard h2{margin:0 0 4px;letter-spacing:1px;color:var(--accent);font-size:20px}
.createCard .sub{margin:0 0 16px;color:var(--muted);font-size:13px}
.form{display:grid;gap:10px}
.form input,.form select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0d1012;color:var(--text)}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
.progress{padding:12px 16px 0;display:flex;gap:4px}
.progress i{flex:1;height:3px;border-radius:99px;background:#2b3338}
.progress i.done{background:var(--accent)}
.storyWrap{flex:1;overflow-y:auto;display:flex;align-items:center;padding:20px}
.storycard{width:100%;max-width:580px;margin:auto;border-radius:20px;border:1px solid #4a5359;background:linear-gradient(180deg,#2a323a,#171c20 80%);padding:26px;box-shadow:0 20px 50px #0007;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.storytext{line-height:1.75;color:#e6ebec;font-size:16.5px}
.storytext i{color:var(--accent);font-style:italic}
.choices{display:grid;gap:10px;margin-top:24px}
.choices button{padding:16px;font-size:15px;border-radius:14px;line-height:1.35}
.choices button:active{border-color:var(--accent)}
.endTitle{color:var(--accent);letter-spacing:1px;font-size:23px;margin:0 0 16px}
.endBadge{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin-bottom:14px}
</style>

<body>

<div id="titleScreen">
<div>
<h1>VALGARD<span>LE DERNIER REMPART</span></h1>
<p class="tagline">Une forteresse assiégée par ses propres secrets. Un soldat, mille chemins. Cinq destins possibles.</p>
<div class="titlebtns">
<button class="primary" onclick="showCreateScreen()">Commencer mon histoire</button>
<button id="continueBtn" class="hidden" onclick="loadGame()">Continuer</button>
</div>
</div>
<div class="foot">Fiction originale non officielle — univers, lieux et personnages inventés.</div>
</div>

<div id="createScreen" class="hidden"></div>
<div id="app" class="hidden"></div>

<script>
const KEY="valgard_legacy_v1";
let G={
started:false,name:"",
traits:{courage:0,loyalty:0,compassion:0,cunning:0},
flags:{origin:null,unit:null,sael:null,yunaStatus:"vivante",exposedTruth:false,joinedProgram:false,acceptedPower:false,protectedEveryone:false,sacrificeMade:false,trustVoss:0},
currentScene:null,depth:0
};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
const TOTAL_STEPS=15;

/* ================= HISTOIRE ================= */
const STORY={

intro:{text:"Le vent qui balaie les remparts de Valgard porte toujours une odeur de fer et de poussière. Avant d'être une recrue parmi tant d'autres, tu étais autre chose. Un souvenir, plus vif que les autres, te revient tandis que la charrette qui t'amène franchit la grande porte.",choices:[
 {label:"L'orphelin·e des ruines — ta ville natale rasée par une <i>anomalie</i> il y a dix ans",next:"o_ruins",effects:g=>{g.flags.origin="ruines";g.traits.courage+=2}},
 {label:"L'enfant de bonne famille — élevé·e dans le confort, en rupture avec les tiens",next:"o_noble",effects:g=>{g.flags.origin="noble";g.traits.cunning+=2}},
 {label:"Le déserteur — tu portes le nom d'un père qui a fui le front, et sa honte avec",next:"o_deserter",effects:g=>{g.flags.origin="deserteur";g.traits.loyalty-=1;g.traits.courage+=1}}
]},
o_ruins:{text:"Tu avais sept ans quand le ciel s'est déchiré au-dessus de ta ville. Ce qui en est sorti n'avait rien d'humain — une masse de chair difforme, haute comme trois maisons, qui a traversé les murs comme du papier mouillé. Tu te souviens du goût de la poussière dans ta gorge, des cris qui s'éteignaient un à un, et de la main d'un inconnu qui t'a tirée hors des décombres avant de disparaître dans la fumée sans même te dire son nom. Depuis ce jour, une question ne t'a jamais quittée : <i>qu'est-ce que c'était, vraiment ?</i> Valgard, dit-on, détient peut-être une partie de la réponse.",choices:[
 {label:"Continuer vers la ville",next:"arrival"}
]},
o_noble:{text:"Ta famille possédait des entrepôts entiers dans la capitale, et un nom qui ouvrait toutes les portes — sauf celles que tu voulais vraiment franchir. Le jour où tu as annoncé vouloir t'engager à Valgard, ta mère a brisé un vase en porcelaine et ton père ne t'a plus adressé la parole. Tu n'as jamais su leur expliquer pourquoi une vie de confort te semblait plus vide qu'un champ de bataille. Peut-être cherches-tu simplement à prouver, à toi-même autant qu'à eux, que tu es capable de quelque chose qui compte vraiment.",choices:[
 {label:"Continuer vers la ville",next:"arrival"}
]},
o_deserter:{text:"Ton père a fui un siège, autrefois, abandonnant douze hommes à une mort certaine pour sauver sa propre peau. Il n'en a jamais parlé ; les autres, si. Tu as grandi avec ce nom accroché à toi comme une seconde peau, celui qu'on murmure dans ton dos. T'engager à Valgard n'est pas un choix : c'est une dette à rembourser, que tu le veuilles ou non. Tu comptes bien prouver que le sang ne fait pas le lâche.",choices:[
 {label:"Continuer vers la ville",next:"arrival"}
]},

arrival:{text:"La charrette s'arrête dans un nuage de poussière ocre. Valgard se dresse devant toi : une forteresse tentaculaire creusée à même une falaise, hérissée de tours de guet et de grues de bois, où des soldats en armure sombre circulent sans un regard pour les nouveaux venus. Une odeur âcre de métal chauffé flotte dans l'air — la forge tourne jour et nuit, dit-on, depuis des années. Un attroupement bruyant se forme près de la grande cour : quelque chose retient l'attention de la foule.",choices:[
 {label:"Te frayer un chemin vers l'attroupement",next:"crowd"},
 {label:"Filer directement vers les baraquements, sans traîner",next:"barracks_direct"},
 {label:"Observer la ville depuis les hauteurs avant de descendre",next:"heights"}
]},
crowd:{text:"Tu te faufiles entre les épaules et les capes. Au centre du cercle, deux soldats retiennent un troisième, un civil hagard aux yeux injectés de sang, qui hurle des mots sans suite — <i>« ils nous mentent, ils nous mentent tous »</i> — avant d'être emmené sans ménagement vers l'intérieur de la forteresse. La foule se disperse en chuchotant. Une jeune recrue à côté de toi, l'air aussi perdu que toi, souffle : « Ça arrive de plus en plus souvent, ces derniers temps. On dit que certains habitants... changent. »",choices:[
 {label:"« Changent comment ? » — insister pour en savoir plus",next:"crowd_ask",effects:g=>{g.traits.cunning+=1}},
 {label:"Ne pas s'attarder sur des rumeurs de recrue nerveuse",next:"barracks",effects:g=>{g.traits.loyalty+=1}}
]},
crowd_ask:{text:"La recrue jette un œil autour d'elle avant de baisser la voix. « On dit qu'ils grandissent. Littéralement. Que leur peau se déchire et qu'il en sort... quelque chose. Un des veilleurs de nuit a disparu la semaine dernière après en avoir vu un. Officiellement, c'est une maladie. Officieusement, personne n'y croit vraiment. » Elle se reprend soudain, mal à l'aise d'en avoir trop dit, et s'éloigne rapidement vers les baraquements.",choices:[
 {label:"La suivre vers les baraquements",next:"barracks"}
]},
barracks_direct:{text:"Tu ignores l'attroupement et rejoins directement les baraquements, sac sur l'épaule, déterminé·e à ne pas perdre de temps. Un sergent bourru t'inscrit sur un registre sans lever les yeux. « Bon réflexe, recrue. Ici, la curiosité tue plus vite que les lames. » Tu ne sauras jamais ce qui agitait la foule que tu as laissée derrière toi — mais quelque chose dans le ton du sergent te dit que ce n'était pas rien.",choices:[
 {label:"Continuer",next:"barracks"}
]},
heights:{text:"Tu grimpes un escalier de service jusqu'à un promontoire dominant la ville. De là-haut, Valgard ressemble à une machine parfaitement huilée : des colonnes de fumée montent d'un bâtiment isolé à l'écart des casernes, entouré d'une double clôture et de gardes bien plus nombreux qu'ailleurs. Aucune enseigne n'indique ce que c'est. Un vieux soldat, accoudé non loin, surprend ton regard. « Ça, petit, c'est un endroit où on ne pose pas de questions. Pas si on veut dormir tranquille. » Il s'éloigne sans un mot de plus.",choices:[
 {label:"Redescendre vers les baraquements, la question en tête",next:"barracks",effects:g=>{g.traits.cunning+=1}}
]},

barracks:{text:"Les baraquements bourdonnent d'activité. Un officier au visage buriné t'accueille, registre en main : le Commandant Ilyan Voss, responsable de l'affectation des nouvelles recrues. Son regard te jauge en un instant, comme s'il lisait déjà en toi. « Trois voies s'offrent à toi ici, recrue. Choisis avec soin — ce choix te suivra plus longtemps que tu ne le crois. »",choices:[
 {label:"Les Remparts — la ligne de défense directe, corps à corps",next:"unit_remparts",effects:g=>{g.flags.unit="Remparts";g.traits.courage+=2}},
 {label:"Les Éclaireurs — reconnaissance et missions hors des murs",next:"unit_eclaireurs",effects:g=>{g.flags.unit="Éclaireurs";g.traits.cunning+=1;g.traits.courage+=1}},
 {label:"Le Renseignement — surveillance intérieure et enquêtes",next:"unit_renseignement",effects:g=>{g.flags.unit="Renseignement";g.traits.cunning+=2}}
]},
unit_remparts:{text:"« Les Remparts, » répète Voss avec un sourire approbateur. « De la chair et de l'acier entre la ville et ce qui rôde dehors. Pas le poste le plus subtil, mais le plus nécessaire. » On te remet une lame courte et une armure qui a visiblement déjà servi — les entailles sur le plastron racontent une histoire que personne ne prend la peine de t'expliquer.",choices:[{label:"Continuer",next:"b1_contact"}]},
unit_eclaireurs:{text:"« Les Éclaireurs, » note Voss en cochant une case. « Peu reviennent indemnes, mais ceux qui reviennent en savent toujours plus que tout le reste de la garnison réuni. » Il te tend une cape légère et un ordre de mission déjà daté de la semaine suivante — ta première sortie hors des murs est imminente.",choices:[{label:"Continuer",next:"b1_contact"}]},
unit_renseignement:{text:"Voss hausse un sourcil, presque amusé. « Le Renseignement. Peu de recrues choisissent ça volontairement. » Il te glisse un badge discret, sans emblème visible. « Ici, ton arme la plus utile, ce sont tes oreilles. Utilise-les avant ta lame. » Tu sens déjà que ce poste t'ouvrira des portes que d'autres ne verront jamais.",choices:[{label:"Continuer",next:"b1_contact"}]},

b1_contact:{text:"Dans la cour d'entraînement, deux visages se détachent du lot. Sael, une recrue au sourire en coin et au regard de défi permanent, t'évalue de haut en bas sans détour : « Alors c'est toi, la nouvelle recrue dont tout le monde parle déjà ? » À l'écart, Yuna, plus discrète, t'observe avec une curiosité franche avant de te sourire sincèrement — la première personne depuis ton arrivée à ne rien exiger de toi.",choices:[
 {label:"Répondre à Sael du tac au tac, sans te laisser démonter",next:"b1_sael_clash",effects:g=>{g.traits.courage+=1}},
 {label:"Ignorer la provocation et rejoindre Yuna",next:"b1_yuna_first",effects:g=>{g.traits.compassion+=1}},
 {label:"Rester en retrait, observer les deux avant de choisir ton camp",next:"b1_observe",effects:g=>{g.traits.cunning+=1}},
 {label:"Proposer directement un duel amical à Sael pour couper court",next:"b1_duel",effects:g=>{g.traits.courage+=1}}
]},
b1_sael_clash:{text:"« On verra si ta langue est aussi rapide que tes poings, » réplique Sael, mi-agacé, mi-impressionné. Un respect prudent s'installe entre vous — le genre qui, avec le temps, pourrait devenir une vraie amitié, ou un vrai conflit. Yuna, en retrait, pouffe discrètement de la scène.",effects:g=>{g.flags.sael="rival_respect"},choices:[{label:"Continuer",next:"c1_rumor"}]},
b1_yuna_first:{text:"Yuna t'accueille comme si vous vous connaissiez depuis toujours. « Ne fais pas attention à Sael, il teste tout le monde comme ça. » Sa gentillesse désarmante te met immédiatement à l'aise dans cet endroit hostile. Sael, resté en retrait, vous observe avec un mélange d'agacement et de curiosité.",effects:g=>{g.flags.sael="distant"},choices:[{label:"Continuer",next:"c1_rumor"}]},
b1_observe:{text:"Tu prends le temps de jauger les deux avant de t'avancer, ce qui n'échappe ni à l'un ni à l'autre. « Prudent·e, » commente Sael avec un sourire en coin qui n'est pas totalement désapprobateur. Yuna, elle, semble simplement amusée par ta réserve. Aucun camp n'est encore scellé — et c'est peut-être mieux ainsi.",effects:g=>{g.flags.sael="neutral"},choices:[{label:"Continuer",next:"c1_rumor"}]},
b1_duel:{text:"Sael accepte ton défi avec un enthousiasme féroce. Le combat est bref, brutal, et se solde par une égalité frustrante pour vous deux — assez pour forcer un respect mutuel immédiat. « Pas mal, » lâche-t-il, essoufflé, en te tendant une main que tu serres. Yuna applaudit, mi-amusée mi-inquiète pour vos côtes.",effects:g=>{g.flags.sael="ally";g.traits.courage+=1},choices:[{label:"Continuer",next:"c1_rumor"}]},

c1_rumor:{text:"Les semaines passent, rythmées par l'entraînement. Puis, un soir, alors que tu regagnes ton dortoir, tu croises un convoi discret escorté par des gardes du Renseignement : trois civils encapuchonnés, menottés, qu'on fait entrer dans le bâtiment isolé que tu as peut-être déjà aperçu depuis les hauteurs de la ville. Personne autour de toi ne semble vouloir en parler — mais leurs regards fuyants disent tout le contraire de leur silence.",choices:[
 {label:"Suivre discrètement le convoi pour voir où il mène vraiment",next:"c2_secret",effects:g=>{g.traits.cunning+=2}},
 {label:"Rapporter ce que tu as vu au Commandant Voss",next:"c2_report",effects:g=>{g.traits.loyalty+=2}},
 {label:"Ne rien faire — ce ne sont pas tes affaires, pas encore",next:"c2_ignore",effects:g=>{g.traits.loyalty+=1}},
 {label:"En parler d'abord à Yuna ou Sael, pour ne pas porter ça seul·e",next:"c2_confide",effects:g=>{g.traits.compassion+=1}}
]},
c2_secret:{text:"Tu te glisses dans l'ombre des entrepôts et suis le convoi jusqu'à la double clôture du bâtiment isolé. À travers une fenêtre mal fermée, tu aperçois furtivement des silhouettes en blouse, des instruments métalliques, et surtout — l'espace d'une seconde avant qu'un garde ne referme un volet — quelque chose de bien trop grand pour être humain, enchaîné dans l'obscurité d'une salle voûtée. Ton sang se glace. Ce que tu viens de voir, tu ne pourras plus jamais l'oublier.",effects:g=>{g.flags.sawTruthEarly=true},choices:[{label:"Continuer",next:"d1_mentor"}]},
c2_report:{text:"Tu te présentes au bureau de Voss et rapportes fidèlement ce que tu as vu. Il t'écoute sans ciller, le visage aussi impénétrable qu'un mur de pierre. « Bien vu, bien rapporté, » dit-il enfin. « C'est exactement le genre de discrétion que j'attends de mes soldats. » Il ne t'en dit pas plus — mais quelque chose dans son regard te fait comprendre que ta loyauté vient d'être remarquée, pour le meilleur ou pour le pire.",effects:g=>{g.flags.trustVoss+=2},choices:[{label:"Continuer",next:"d1_mentor"}]},
c2_ignore:{text:"Tu détournes le regard et poursuis ton chemin. Ce soir-là, tu dors mal, hanté par des images que tu n'as même pas vraiment vues — seulement devinées. Le doute, une fois planté, ne s'arrache pas si facilement.",choices:[{label:"Continuer",next:"d1_mentor"}]},
c2_confide:{text:"Tu racontes la scène à Yuna, qui pâlit visiblement, et à Sael, qui se contente de hausser les épaules avec un peu trop d'insistance. « Il y a des choses qu'on ne regarde pas en face, ici, si on veut vieillir, » dit-il finalement, presque comme une mise en garde. Yuna, elle, garde le silence — mais tu la sens désormais aussi inquiète que toi.",effects:g=>{g.traits.compassion+=1},choices:[{label:"Continuer",next:"d1_mentor"}]},

d1_mentor:{text:"Le Commandant Voss te convoque en privé, un soir, dans son bureau éclairé à la seule lumière d'une lampe à huile. « Tu poses les bonnes questions, recrue. Ou tu en as trop entendu. L'un ou l'autre, ça te met dans une position délicate. » Il pousse vers toi un dossier scellé, sans l'ouvrir. « Ce que ce dossier contient pourrait sauver Valgard. Ou la détruire, si la population l'apprenait mal. Je te fais confiance pour comprendre la différence — ou pas. »",choices:[
 {label:"Ouvrir le dossier immédiatement, devant lui",next:"d1_open",effects:g=>{g.traits.courage+=1}},
 {label:"Refuser de le prendre — tu ne veux pas de ce fardeau",next:"d1_refuse",effects:g=>{g.traits.loyalty+=1}},
 {label:"Le prendre sans l'ouvrir, et poser tes propres conditions",next:"d1_conditions",effects:g=>{g.traits.cunning+=2}}
]},
d1_open:{text:"Tu brises le sceau sans hésiter. À l'intérieur : des rapports d'expérimentation, des noms de volontaires — et de prisonniers non-volontaires —, et une conclusion glaçante griffonnée en marge d'un des derniers feuillets : <i>« le sérum fonctionne. Le contrôle, non. »</i> Voss ne dit rien, se contentant d'observer ta réaction avec une attention presque clinique.",effects:g=>{g.flags.sawTruthEarly=true;g.flags.trustVoss-=1},choices:[{label:"Continuer",next:"e1_betrayal"}]},
d1_refuse:{text:"« Je ne veux pas savoir, » dis-tu fermement, repoussant le dossier. Voss hoche lentement la tête, presque déçu, presque soulagé. « La plupart des soldats sages font ce choix. Peu le regrettent. » Le dossier disparaît dans un tiroir verrouillé — mais la question, elle, continuera de te ronger.",choices:[{label:"Continuer",next:"e1_betrayal"}]},
d1_conditions:{text:"« Je le prends, » dis-tu, « mais je veux savoir ce que vous attendez de moi en échange. » Voss esquisse un sourire rare, presque satisfait. « Voilà une question de soldat qui compte survivre longtemps ici. » Il ne répond pas directement — mais à partir de cet instant, tu sens qu'il te considère différemment : comme un pion utile, ou un allié potentiel.",effects:g=>{g.flags.trustVoss+=1},choices:[{label:"Continuer",next:"e1_betrayal"}]},

e1_betrayal:{text:"La vérité, tu la tiens désormais, en partie ou en totalité : Valgard abrite en secret le <i>Projet Aube</i>, un programme militaire cherchant à transformer des sujets humains — volontaires, prisonniers, parfois de simples citoyens disparus dans la nuit — en armes vivantes aussi monstrueuses que les créatures qui rôdent au-delà des murs. Certains essais ont réussi. Beaucoup ont échoué, dans d'atroces souffrances tues à la population. Le convoi que tu as vu, le civil hagard sur la place, les rumeurs de gens qui « changent » — tout se recoupe, tout devient limpide et insoutenable à la fois.",choices:[
 {label:"Exposer la vérité publiquement, quel qu'en soit le prix",next:"f1_expose",effects:g=>{g.flags.exposedTruth=true;g.traits.compassion+=2;g.traits.loyalty-=2}},
 {label:"Rassembler discrètement plus de preuves avant d'agir",next:"f1_evidence",effects:g=>{g.traits.cunning+=2}},
 {label:"Faire remonter l'information à la hiérarchie, dans les règles",next:"f1_chain",effects:g=>{g.traits.loyalty+=2}},
 {label:"Te porter volontaire pour rejoindre le programme de l'intérieur",next:"f1_join",effects:g=>{g.flags.joinedProgram=true;g.traits.cunning+=1;g.traits.courage+=1}}
]},
f1_expose:{text:"Tu choisis la voie la plus dangereuse : la vérité, criée haut et fort sur la place centrale, devant une foule d'abord incrédule puis rapidement paniquée. En quelques heures, Valgard bascule dans le chaos — émeutes, arrestations, une partie de la garnison qui se retourne contre le commandement. Voss te fait arrêter le soir même, le regard plus triste que furieux. « Tu as peut-être sauvé des vies futures. Tu en as aussi condamné beaucoup, aujourd'hui même. » Sael, s'il est ton allié, prend un risque terrible pour t'aider à t'échapper des cachots avant le jugement.",effects:g=>{g.traits.compassion+=1},choices:[{label:"Continuer",next:"g1_cost"}]},
f1_evidence:{text:"Tu joues la carte de la patience, recoupant discrètement témoignages, registres de livraisons et disparitions inexpliquées, nuit après nuit, au péril d'être découvert·e à chaque instant. Le dossier que tu constitues, méthodique et accablant, pourrait faire tomber le programme entier — à condition de trouver le bon moment, et la bonne personne à qui le confier.",effects:g=>{g.traits.cunning+=1},choices:[{label:"Continuer",next:"g1_cost"}]},
f1_chain:{text:"Tu suis la voie officielle, remontant l'information par les canaux hiérarchiques appropriés, en évitant soigneusement tout éclat public. La réponse est lente, feutrée, presque décevante : une commission d'enquête discrète est ouverte, sans grand bruit ni grande conséquence immédiate. Voss t'observe avec un respect nouveau. « C'est ainsi qu'on change les choses sans tout faire s'effondrer, recrue. Parfois. »",effects:g=>{g.flags.trustVoss+=2},choices:[{label:"Continuer",next:"g1_cost"}]},
f1_join:{text:"Tu te portes volontaire, officiellement pour « mieux comprendre le programme de l'intérieur » — officieusement, pour savoir jusqu'où tu es prêt·e à aller. Les chercheurs t'accueillent avec une froideur clinique, et pour la première fois, tu vois de tes propres yeux le processus complet : la douleur, les cris, les rares succès applaudis comme des victoires militaires alors qu'il s'agit de vies brisées. Une part de toi ne s'en remettra jamais tout à fait.",effects:g=>{g.traits.cunning+=1;g.traits.compassion-=1},choices:[{label:"Continuer",next:"g1_cost"}]},

g1_cost:{text:g=>{
if(g.flags.exposedTruth)return "Dans le chaos qui a suivi ta révélation, une émeute éclate près des entrepôts. Yuna, toujours prompte à se porter au secours des civils pris au piège, se retrouve isolée face à une patrouille hostile qui l'accuse de complicité. Sael, s'il te considère comme un allié, se précipite pour la couvrir — au prix d'une blessure profonde qui le clouera au lit pour des semaines.";
if(g.flags.joinedProgram)return "Un des sujets du programme, autrefois un simple pêcheur du village voisin, échappe partiellement au contrôle des chercheurs durant une phase de transformation. La panique est brève mais terrible ; l'homme, ou ce qu'il en reste, est abattu avant d'avoir pu faire de mal à quiconque. Tu comprends alors, avec une clarté glaçante, que ce que tu as accepté de voir de près a un prix humain que personne ne te fera jamais oublier.";
return "Une attaque isolée frappe un poste de garde avancé durant la nuit — une créature échappée du programme, désorientée et dangereuse, sème la panique avant d'être maîtrisée de justesse. Personne n'est mort, cette fois. Mais la question qui plane sur Valgard depuis le début vient de devenir, pour la première fois, terriblement concrète pour tout le monde autour de toi.";
},choices:[
 {label:"Te porter en première ligne pour limiter les dégâts",next:"h1_power_offer",effects:g=>{g.traits.courage+=2;g.flags.protectedEveryone=true}},
 {label:"Rester en retrait et laisser les unités spécialisées gérer",next:"h1_power_offer",effects:g=>{g.traits.cunning+=1}}
]},

h1_power_offer:{text:"Dans les jours qui suivent, alors que la tension à Valgard atteint son point de rupture, Voss te convoque une dernière fois — seul, sans témoin. « Le programme a besoin d'un sujet volontaire, conscient, capable de garder le contrôle là où tant d'autres ont échoué. Quelqu'un comme toi. Ce serait un pouvoir terrible. Peut-être suffisant pour changer le cours de cette guerre — ou pour te perdre toi-même. » Il attend ta réponse sans ciller.",choices:[
 {label:"Accepter — devenir toi-même l'arme que Valgard cherche",next:"i1_accept",effects:g=>{g.flags.acceptedPower=true;g.traits.courage+=2}},
 {label:"Refuser catégoriquement ce pouvoir et tout ce qu'il représente",next:"i1_refuse",effects:g=>{g.traits.compassion+=2}},
 {label:"Refuser pour toi, mais proposer que le programme soit encadré et surveillé plutôt qu'arrêté",next:"i1_reform",effects:g=>{g.traits.cunning+=2;g.traits.loyalty+=1}}
]},
i1_accept:{text:"Tu acceptes. La transformation, quand elle vient, est une douleur au-delà de tout ce que tu avais imaginé — un feu qui remonte chaque veine, un cri qui n'est plus tout à fait le tien. Mais tu gardes le contrôle, contre toute attente, contre toute probabilité. Quand tes yeux se rouvrent, quelque chose en toi a changé pour toujours. Tu es devenu·e exactement ce que Valgard espérait : une arme. La question qui reste, c'est de savoir à qui cette arme obéira, désormais.",choices:[{label:"Affronter ce que tu es devenu·e",next:"final"}]},
i1_refuse:{text:"« Non, » dis-tu, sans une once d'hésitation. « Pas comme ça. Pas sur le dos d'autres vies brisées avant la mienne. » Voss encaisse ton refus sans un mot, mais quelque chose dans son regard te dit qu'il s'y attendait, presque qu'il l'espérait. Le programme continuera peut-être sans toi — mais toi, au moins, tu restes entier·e.",choices:[{label:"Continuer",next:"final"}]},
i1_reform:{text:"« Arrêtez de chercher des armes, » proposes-tu, « et commencez à chercher un remède, ou au moins un cadre éthique digne de ce nom. » C'est un pari risqué, à mi-chemin entre la compromission et l'espoir. Voss te regarde longuement, comme s'il soupesait réellement ta proposition pour la première fois depuis que tu le connais. « Peut-être, » dit-il enfin, « que c'est exactement ce dont Valgard avait besoin depuis le début : quelqu'un qui refuse de choisir entre les deux extrêmes. »",choices:[{label:"Continuer",next:"final"}]},

final:{text:"Les années passent. Valgard tient toujours debout, cicatrice après cicatrice, secret après secret. Ce que tu es devenu·e dans cette forteresse — soldat loyal, ombre manipulatrice, arme vivante, ou simple témoin ayant refusé de détourner le regard — c'est désormais une histoire qu'on raconte, avec plus ou moins d'exactitude, dans les tavernes et les casernes.",choices:[
 {label:"Découvrir comment ton histoire s'est terminée",action:()=>showEnding()}
]}
};

function sceneText_(sc,g){return typeof sc.text==="function"?sc.text(g):sc.text}
function scene(id){let sc=STORY[id];if(!sc)return;G.currentScene=id;G.depth=Math.min(TOTAL_STEPS,G.depth+1);render()}
function chooseOption(i){let sc=STORY[G.currentScene];let c=sc.choices[i];if(c.effects)c.effects(G);if(c.action){G.currentScene=null;c.action();return}if(c.next)scene(c.next)}

/* ================= INTERFACE ================= */
function showCreateScreen(){
document.getElementById("titleScreen").classList.add("hidden");
let el=document.getElementById("createScreen");
el.classList.remove("hidden");
el.innerHTML=`<div class="createCard">
<h2>Qui es-tu ?</h2><p class="sub">Le début de ton histoire, avant même d'arriver à Valgard.</p>
<div class="form">
<input id=n placeholder="Prénom / nom" maxlength=24>
<button class="primary" onclick="finishCreate()">Commencer</button>
</div></div>`;
}
function finishCreate(){
let n=document.getElementById("n").value.trim();if(!n)return alert("Choisis un nom.");
G.started=true;G.name=n;
scene("intro");
}
function render(){
if(!G.started){
document.getElementById("continueBtn").classList.toggle("hidden",!localStorage.getItem(KEY));
return;
}
document.getElementById("titleScreen").classList.add("hidden");
document.getElementById("createScreen").classList.add("hidden");
let app=document.getElementById("app");
app.classList.remove("hidden");
app.innerHTML=`
<div class="progress">${Array.from({length:TOTAL_STEPS}).map((_,i)=>`<i class="${i<G.depth?"done":""}"></i>`).join("")}</div>
<div class="storyWrap">${G.currentScene?storyCardHTML():""}</div>`;
saveGame();
}
function storyCardHTML(){
let sc=STORY[G.currentScene];
return `<div class="storycard"><div class="storytext">${sceneText_(sc,G)}</div><div class="choices">${sc.choices.map((c,i)=>`<button onclick="chooseOption(${i})">${c.label}</button>`).join("")}</div></div>`;
}

/* ================= FINS (5 fins entièrement écrites) ================= */
function selectEnding(){
let t=G.traits;
if(G.flags.acceptedPower)return "power";
if(G.flags.exposedTruth&&t.compassion>=t.loyalty)return "truth";
if(G.flags.joinedProgram)return "shadow";
if(G.flags.trustVoss>=2&&t.loyalty>=t.cunning&&t.loyalty>=t.compassion)return "commander";
return "quiet";
}
const ENDINGS={
truth:{title:"La Vérité Brisée",badge:"Fin — Révélation",text:g=>`Ton nom est devenu synonyme de scandale, puis de courage, selon qui le prononce. La révélation du Projet Aube a coûté cher à Valgard : des mois de chaos, un commandement décapité, une confiance envers l'armée qu'il faudra une génération pour reconstruire. Mais plus jamais un civil ne disparaîtra en silence dans un bâtiment sans nom. ${g.flags.sael==="ally"?"Sael, resté fidèlement à tes côtés malgré le prix payé, est devenu l'un des rares officiers en qui la population place encore sa confiance.":"Tu as traversé cette tempête largement seul·e, et cette solitude ne t'a jamais vraiment quitté·e."} On te croise encore parfois près des remparts, regardant l'horizon, ni tout à fait héros ni tout à fait renégat·e — simplement quelqu'un qui a refusé de détourner le regard, quoi qu'il en coûte.`},
power:{title:"Le Prix du Pouvoir",badge:"Fin — Transformation",text:g=>`Tu es devenu·e exactement ce que Valgard espérait : une arme consciente, capable de rivaliser avec les créatures qui rôdent au-delà des murs. Les batailles que tu as remportées depuis sont déjà légendaires — mais la légende a un prix. Les gens te regardent différemment désormais : avec un respect teinté de peur, une distance polie que même ${g.flags.sael==="ally"?"Sael n'a jamais réussi à combler entièrement, malgré ses efforts constants":"personne n'a jamais vraiment cherché à combler"}. Tu protèges Valgard, nuit après nuit, plus fort que quiconque avant toi. Mais certains soirs, seul·e face au silence de ta caserne, tu te demandes ce qu'il reste exactement d'humain dans ce que tu es devenu·e — et si quelqu'un, un jour, saura encore répondre à cette question à ta place.`},
shadow:{title:"L'Ombre Silencieuse",badge:"Fin — Complicité",text:g=>`Tu as choisi de rester à l'intérieur du programme, d'en apprendre chaque rouage plutôt que de le combattre de l'extérieur. Avec le temps, tu en es devenu·e une pièce indispensable — celle qui sait où sont enterrés les vrais secrets, celle que même Voss consulte avant de prendre une décision. Ton pouvoir n'est pas celui d'un titan, mais celui, plus insidieux, de savoir. ${g.flags.trustVoss>=1?"Voss t'a fini par te considérer comme un successeur possible, ce qui n'est pas un compliment anodin de sa part.":"Tu as appris à te méfier de tout le monde, Voss y compris, et cette méfiance t'a probablement sauvé la vie plus d'une fois."} Valgard continue de tourner, ses secrets bien gardés, et toi au cœur de cette mécanique discrète — ni tout à fait complice, ni tout à fait innocent·e, quelque part entre les deux, pour toujours.`},
commander:{title:"Le Bouclier de Valgard",badge:"Fin — Loyauté",text:g=>`Ta loyauté indéfectible envers la chaîne de commandement, jamais démentie même dans les moments les plus troubles, a fini par payer. Tu portes aujourd'hui les insignes d'officier, respecté·e par tes soldats autant que par tes supérieurs. Le Projet Aube a été discrètement réformé plutôt qu'exposé au grand jour — un compromis imparfait, mais un progrès réel, en grande partie grâce à ta capacité rare à garder la confiance de tout le monde à la fois. ${g.flags.sael==="ally"?"Sael sert aujourd'hui sous tes ordres, aussi fier de toi qu'insupportablement moqueur à ce sujet.":"Tu diriges avec une froideur efficace que même Sael, à distance, a fini par respecter."} Valgard tient debout. Et pour la première fois depuis longtemps, elle tient debout sans mentir tout à fait à ceux qui la défendent.`},
quiet:{title:"Une Vie Parmi Tant d'Autres",badge:"Fin — Discrétion",text:g=>`Tu n'as jamais cherché à devenir une légende, et l'histoire de Valgard ne retiendra probablement pas ton nom. Tu as fait ton devoir, encaissé les secrets qu'on t'a confiés sans jamais vraiment les porter jusqu'au bout, ni dans un sens ni dans l'autre. C'est une vie plus tranquille que celle de bien des recrues arrivées en même temps que toi — certaines mortes, d'autres devenues des figures que l'on chuchote avec crainte ou admiration. ${g.flags.yunaStatus==="vivante"?"Yuna, elle, est restée une amie fidèle à travers toutes ces années, l'une des rares constantes dans une ville qui change sans cesse.":"Le souvenir de Yuna, elle, ne t'a jamais vraiment quitté."} Peut-être qu'au fond, ne pas devenir une légende est exactement la victoire la plus discrète, et la plus durable, que Valgard pouvait t'offrir.`}
};
function showEnding(){
let key=selectEnding();
let e=ENDINGS[key];
document.getElementById("app").innerHTML=`<div class="storyWrap"><div class="storycard">
<span class="endBadge">${e.badge}</span>
<div class="endTitle">${e.title}</div>
<div class="storytext"><b>${esc(G.name)}</b><br><br>${e.text(G)}</div>
<div class="choices"><button class="primary" onclick="resetGame()">Vivre une autre histoire</button></div>
</div></div>`;
localStorage.removeItem(KEY);
}
function saveGame(){if(G.started&&G.currentScene)localStorage.setItem(KEY,JSON.stringify(G))}
function loadGame(){let s=localStorage.getItem(KEY);if(!s)return;G=JSON.parse(s);render()}
function resetGame(){localStorage.removeItem(KEY);location.reload()}
render();
</script>
</body>
</html>
